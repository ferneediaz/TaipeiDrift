speed_mps: 35.0             # cruise ground speed (30-40 m/s)
rate_hz: 100                # truth / IMU rate
altitude_mode: msl          # msl | agl
agl_m: null                 # overrides the route's agl_m when set (altitude sweeps)
max_bank_deg: 30.0
bank_time_const_s: 1.5      # first-order roll response
heading_gain: 1.2           # commanded bank [rad] per rad heading error
lookahead_m: 800.0          # line-following lookahead
max_climb_mps: 5.0
agl_lookahead_m: 2000.0     # terrain look-ahead for constant-AGL mode
agl_corridor_m: 300.0       # terrain max taken in a +-corridor around the track
min_clearance_m: 300.0      # asserted terrain clearance (DSM)
max_slant_range_m: 5000.0   # asserted: every beam's ground range must be below this
earth_radius_m: 6371000.0
