name: m5_clouds
description: M5 - cloud fraction sweep 0-90 %, tactical and navigation-grade IMU, paired runs (same sensor data for all filters).
routes: [A_mountain_crossing, C_foothills]
filters: [tercom, mpf_baseline, mpf_gated, mpf_proposed]
runs: 20
quick_runs: 4
overrides:
  atmosphere.enabled: true
sweep:
  imu.grade: [tactical, navigation]
  atmosphere.cloud_fraction: [0.0, 0.1, 0.3, 0.5, 0.7, 0.9]
