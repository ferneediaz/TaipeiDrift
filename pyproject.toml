[project]
name = "defense-hackathon"
version = "0.1.0"
description = "Taiwan Defense Tech Hackathon 2026 (EDTH x NTU), 2-4 Oct 2026"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "opencv-python",
    "rasterio",
    "pyproj",
    "jupyterlab",
    "ipykernel",
    # demo view
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    # tests
    "pytest",
    "h5py>=3.16.0",
]

[tool.uv]
package = false
