# Camera navigator on the simulated Wufeng flight (sim/scripts/route_flight.py, recorded by sim/nodes/recorder.py).
# Relative paths are resolved from the repository root.
#
# Unlike UAV-VisLoc, the dead reckoning here is real: optical flow on the simulated camera images, as on ALTO.
# The ground the camera sees is the 2020 aerial image; the map is the 2018 image (map_2018) or, to show the
# price of an old map, the 2020 image itself (map_2020_fresh).

output_dir: outputs/sim_navigator
recording: recordings/wufeng_corridor_100m
route: sim/scenarios/wufeng_corridor.json
cache_dir: data/processed
maps:
  "2018": data/raw/aerial/wufeng_2018-05-03_x4.tif
  "2020": data/raw/aerial/wufeng_2020-03-23_x4.tif
seeds: [1, 2, 3]          # each seed draws its own compass error
alert_limit_m: 50.0

# The simulated flights and their roles, fixed on Saturday 3 October at 15:20, before the new flights were recorded.
# development: the navigator may be changed after looking at these.
# held_out: run once with frozen settings; that first result is the one we report, and afterwards the flight counts
#   as seen. wufeng_south_80m was run at 15:05 with save point 1's settings (only calibration_zooms widened, below).
# sealed: not run, not looked at, until the improvement loop ends (19:00); then run once, and those are the numbers.
# All of them fly the same corridor (the only ground both aerial images cover); they differ in height, speed and direction.
flights:
  development:
    wufeng_corridor_100m: sim/scenarios/wufeng_corridor.json     # 100 m, 10 m/s, north first
    wufeng_north_120m: sim/scenarios/wufeng_north_120m.json      # 120 m, 12 m/s, north first
    wufeng_south_65m: sim/scenarios/wufeng_south_65m.json        # 65 m, 6.5 m/s, south first
  held_out:
    wufeng_south_80m: sim/scenarios/wufeng_south_80m.json        # 80 m, 8 m/s, south first
  sealed:
    wufeng_north_90m: sim/scenarios/wufeng_north_90m.json        # 90 m, 9 m/s, north first
    wufeng_south_110m: sim/scenarios/wufeng_south_110m.json      # 110 m, 8 m/s, south first
plot: [camera_alone, map_2018, map_2020_fresh]

navigator:                # the settings frozen for the UAV-VisLoc held-out test (confirm_body), GNSS for the first 450 m
  jam_after_m: 450.0
  search: area
  fix_every_m: 300.0
  min_score: 0.33
  fix_sigma_m: 15.0
  drift_rate: 0.10
  gate_sigmas: 3.0
  min_search_radius_m: 60.0
  max_search_radius_m: 600.0
  confirm_jumps: true
  offset_frame: body
  camera_motion_floor: 0.3
  motion_fit: rotation_scale  # the fixed camera of a quadcopter tilts in turns; see navigator_core.fit_rotation_scale
  # The zooms must cover the heights flown: zoom = height / 128 for this camera (512 px, 90 degrees) and the
  # 0.5 m map, so 0.63 at 80 m and 0.78 at 100 m. The default 0.60 to 1.00 covers only about 77 to 128 m;
  # 0.45 to 1.05 covers about 58 to 134 m. Widened when flight 2 (80 m) stopped at the zoom check in
  # calibrate(), before any of its navigation results existed.
  calibration_zooms: [0.45, 1.05]
  # Keep the scale learned before the jam: our drone holds its height over flat ground, and re-reading the
  # height from each fix's zoom (in steps of 0.05) changed the distance flown by 6 to 13 percent until the
  # next fix. Kept at 16:00 on the development flights: 2018 map, flight 1 26.5 -> 18.5 m median (now works),
  # 120 m 30.9 -> 28.6 m and its 3 wrong fixes gone (now works), 65 m 39.8 -> 26.6 m (still fails: 1 wrong fix).
  scale_from_fixes: false
  # The zooms searched after the jam must cover the heights flown too (the defaults, 0.60 to 1.10, miss the 65 m
  # flight's 0.51: after 400 m without a fix it searched only wrong scales). And a jump from a search wider than
  # 100 m (default 150 m) waits for the next fix to confirm it: the 65 m flight has a look-alike 74 m off at
  # 1.32 km, found by a 134 m search and accepted before. Kept at 16:50: every development flight works
  # (no wrong fix, bound held 99 percent, never "within 50 m" while further off); the price is fewer fixes used
  # and a median 4 to 10 m higher.
  wide_zooms: [0.45, 1.05]
  zoom_limits: [0.45, 1.05]
  confirm_above_radius_m: 100.0

heading:                  # src/sensors/heading.py and sun_sensor.py; choose with source (sim_dev_check.py --heading)
  source: sun_digital     # compass, sun_digital or sun_photodiode. The sun since 17:00 (save point 4): on every
  # development flight better than the compass (2018 map median 22.0 -> 16.5 m, 34.4 -> 32.3, 30.3 -> 18.0) and
  # every flight still works; the photodiode sensor is about as good as the compass and fails the 120 m flight
  when: "2026-10-04T13:00:00+08:00"   # the flight's date and time, for the sun: the demo, sun at about 56 degrees
  compass: {offset_sd_deg: 4.0, noise_sd_deg: 1.0}
  sun_digital: {kind: digital}         # Fan, Peng and Gao 2016: 0.1 degree, 65-degree view, mounting error
  sun_photodiode: {kind: photodiode}   # five photodiodes on a pyramid, cosine law, sky and ground light

cameras:                  # src/data/camera_model.py; choose one with --camera (default ideal)
  ideal: null             # the simulator's frames: a perfect pinhole in still, clear air
  realistic:              # cloud shadows drifting with the wind, haze, lens, vibration, auto-exposure, noise, JPEG
    cloud_cover: 0.3
    cloud_shadow: 0.35
    cloud_size_m: 400.0
    wind_east_mps: 4.0
    wind_north_mps: 2.0
    haze_contrast: 0.9
    vignetting: 0.4
    distortion_k1: 0.004
    blur_px: 0.6
    gain_wobble: 0.05
    light: 1.0
    jpeg_quality: 80
    seed: 0               # the weather of the day: one draw of clouds for every compass seed

runs:
  camera_alone:   {map: "2018", fix_every_m: null}
  map_2018:       {map: "2018"}
  map_2020_fresh: {map: "2020"}
