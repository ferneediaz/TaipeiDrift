# Visual-attitude-assisted dead reckoning on Mid-Air, compared with the IMU-only baseline.
# Relative paths are resolved from the repository root. Command-line flags override these values.

baseline_config: baseline/configs/midair_baseline.yaml  # Mid-Air paths, keys and conventions come from here
gnss_cutoff_s: 5.0
output_dir: outputs/midair_vio
error_horizons_s: [10, 30, 60]
error_thresholds_m: [1, 5, 10, 50, 100]

camera: left            # down or left; see vio/README.md for why left is the default
downscale: 2            # process 1024 px frames at 512 px

# Camera models. Calibrated offline on Kite_training/sunny/trajectory_0000 (vio/README.md):
# 90 deg field of view, frame i taken at IMU sample 4 i, mounting an exact axis permutation.
# R_bc rotates camera vectors (x right, y down, z optical axis) into the body frame.
cameras:
  down:
    stream: color_down
    hfov_deg: 90.0
    rate_hz: 25.0
    frame_offset_samples: 0
    R_bc: [[0, -1, 0], [1, 0, 0], [0, 0, 1]]   # optical axis = body down, image up = body forward
    pose_model: homography                      # flat ground seen from above
  left:
    stream: color_left
    hfov_deg: 90.0
    rate_hz: 25.0
    frame_offset_samples: 0
    R_bc: [[0, 0, 1], [1, 0, 0], [0, 1, 0]]    # optical axis = body forward (left camera of the stereo pair)
    pose_model: essential

tracker:
  max_corners: 400
  quality_level: 0.01
  min_distance: 10
  block_size: 7
  lk_window: 21
  lk_levels: 3
  fb_max_error: 1.0
  min_tracks: 80
  max_keyframe_age: 25      # frames (1 s); chosen on trajectory_0001, see vio/README.md

pose:
  ransac_threshold_px: 1.0
  ransac_confidence: 0.999
  min_correspondences: 30
  min_inliers: 30
  min_inlier_ratio: 0.5
  min_median_flow_px: 0.0

# Chosen on the tuning flight Kite_training/sunny/trajectory_0001 (lowest mean attitude error),
# never on the evaluation flights.
fusion:
  gain: 0.05                # 0 = IMU only, 1 = trust the camera's relative rotation fully
  max_disagreement_deg: 1.0 # reject camera rotations this far from the gyro's
  min_keyframe_gap: 1       # frames
