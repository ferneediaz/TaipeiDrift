[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1920x1080x24
priority=10
autorestart=true

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":1"
priority=20
autorestart=true

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -nopw -rfbport 5900 -quiet
priority=30
autorestart=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
priority=40
autorestart=true
